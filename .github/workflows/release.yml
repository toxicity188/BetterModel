name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      PACKAGES_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^project_version=//p' gradle.properties | tr -d '\r')
          if [[ -z "$version" || "$RELEASE_TAG" != "$version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match project_version '$version'."
            exit 1
          fi
          test -s "changelog/$version.md"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish and release to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral --stacktrace

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationToGitHubPackagesRepository --stacktrace

      - name: Publish to Modrinth
        run: ./gradlew modrinth --stacktrace

      - name: Publish to Hangar
        run: ./gradlew publishPluginPublicationToHangar --stacktrace
